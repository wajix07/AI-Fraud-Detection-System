services:
  - type: web
    name: ai-fraud-detection-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://fraudshield-ai-dashboard.onrender.com
